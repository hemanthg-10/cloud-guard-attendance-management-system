<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance - Attendance Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-calendar-check me-2"></i> Attendance Portal
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="attendance.html">Mark Attendance</a></li>
                    <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-5">
                    <h2 class="fw-bold mb-4">Mark Your Attendance</h2>
                    
                    <div class="mb-5">
                        <div id="current-time">00:00:00</div>
                        <p class="text-muted" id="real-date">Monday, March 16, 2026</p>
                    </div>

                    <div id="attendance-message"></div>

                    <div class="d-grid gap-3">
                        <button class="btn btn-primary btn-lg-custom" id="checkin-btn" onclick="handleAttendance('/checkin')">
                            <i class="fas fa-sign-in-alt me-2"></i> Check-In
                        </button>
                        <button class="btn btn-outline-primary btn-lg-custom" id="checkout-btn" onclick="handleAttendance('/checkout')">
                            <i class="fas fa-sign-out-alt me-2"></i> Check-Out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Back Button -->
    <div class="back-btn-container">
        <a href="javascript:history.back()" class="back-btn" title="Go Back">
            <i class="fas fa-arrow-left"></i>
        </a>
    </div>

    <script src="js/api.js"></script>
    <script>
        api.checkAuth();

        const logout = () => api.logout();

        // Real-time clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleTimeString();
        }, 1000);

        document.getElementById('real-date').textContent = new Date().toLocaleDateString(undefined, {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        async function handleAttendance(endpoint) {
            const btn = endpoint === '/checkin' ? document.getElementById('checkin-btn') : document.getElementById('checkout-btn');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Processing...`;

            try {
                // For direct check-in and check-out, we use the signed-in email from the local session
                const userEmail = localStorage.getItem('user_email');
                const reg_id = userEmail.split('@')[0].toUpperCase(); // Mock reg_id from email
                
                const data = {
                    date: new Date().toISOString().split('T')[0],
                    reg_id: reg_id,
                    student_name: userEmail,
                    section: 'A', // Default or derived
                    status: endpoint === '/checkin' ? 'P' : 'L'
                };

                const res = await api.post('/attendance', { records: [data] });
                showMessage('attendance-message', res.message, 'success');
            } catch (err) {
                console.error(err);
                showMessage('attendance-message', err.message || 'Action failed. Please try again.', 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        }
    </script>
</body>
</html>
